# wasmrt — a fast, small, idiomatic-Rust WebAssembly runtime.
# Workspace of three crates (see cmem/architecture.md):
#   wasmrt-core  — the runtime library, no_std-friendly + wasm32-freestanding-clean
#   wasmrt-capi  — the wasmrt.h C ABI (cdylib + staticlib) over core
#   wasmrt       — the `wasmrt` command-line binary (published as `wasmrt`)
[workspace]
resolver = "3"
members = ["crates/wasmrt-core", "crates/wasmrt-capi", "crates/wasmrt"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Jon Marcum <jrmarcum.se@gmail.com>"]
repository = "https://github.com/synapticforge1/wasmrt"
# Each crate carries its own `description`; a workspace one was inherited by none of them.

[workspace.dependencies]
wasmrt-core = { path = "crates/wasmrt-core", version = "1.0.0" }

# Shared lint posture — keep the port clean from the first line (cmem/testing.md discipline).
[workspace.lints.clippy]
all = "warn"

# Size is a first-class goal (cmem/design-decisions.md size levers). Applied to the
# shipped artifacts; pick per-artifact tuning later (ReleaseSmall-equivalent).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
