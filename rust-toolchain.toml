# Pin the toolchain + the targets the dual-target contract needs (cmem/architecture.md).
# nightly: reserved for build-std (freestanding wasm32, panic=abort custom sysroot) at a later step.
[toolchain]
channel = "nightly"
components = ["clippy", "rustfmt"]
# x86_64-unknown-linux-gnu and x86_64-pc-windows-gnu: `scripts/gate.ts` type-checks (clippy) the OTHER
# OS's `cfg` paths — Linux on Windows, Windows on Linux — because CI runs Linux and the owner runs
# Windows (2026-11-12). Standard libraries only; no linker is needed for a check. On a host whose own
# target one of them is, that entry costs nothing.
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
