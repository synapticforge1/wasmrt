# Pin the toolchain + the targets the dual-target contract needs (cmem/architecture.md).
# nightly: reserved for build-std (freestanding wasm32, panic=abort custom sysroot) at a later step.
[toolchain]
channel = "nightly"
components = ["clippy", "rustfmt"]
# x86_64-unknown-linux-gnu: `scripts/gate.ts` type-checks (clippy) the Linux `cfg` paths on Windows
# too, because CI runs Linux and the owner runs Windows (2026-11-12). Its standard library only; no
# linker is needed for a check.
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "x86_64-unknown-linux-gnu"]
