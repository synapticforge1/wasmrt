# Pin the toolchain + the targets the dual-target contract needs (cmem/architecture.md).
# nightly: reserved for build-std (freestanding wasm32, panic=abort custom sysroot) at a later step.
# Dated (owner, 2026-11-24): one nightly, the same build on Windows and Linux — the one release.yml
# pins (RUST_TOOLCHAIN), so a local build and CI's compile with the same rustc (708c94ef0).
[toolchain]
channel = "nightly-2026-11-04"
components = ["clippy", "rustfmt"]
# platform: linux-x64 win-x64 — x86_64-unknown-linux-gnu and x86_64-pc-windows-gnu: `scripts/gate.ts`
# type-checks (clippy) the OTHER OS's `cfg` paths — Linux on Windows, Windows on Linux — so code only
# one OS compiles is linted on either (2026-11-12; cmem/platforms.md). Standard libraries only; no
# linker is needed for a check. On a host whose own target one of them is, that entry costs nothing.
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
