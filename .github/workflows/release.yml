name: release

# On a version tag: first the COMPATIBILITY GATE (the tag's version must be the
# manifest's and must clear the SemVer floor since the last release, letter H6),
# then a GitHub Release from the CHANGELOG. Publishing to crates.io stays manual
# (the owner runs `cargo publish`, AFTER this gate is green); see cmem/releasing.md.
# No secrets: the built-in GITHUB_TOKEN is enough.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  compatibility-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit, with history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the nightly toolchain (rustdoc JSON for the surface diff)
        run: rustup toolchain install nightly --profile minimal

      - name: Install the surface and semver tools, at the versions releasing.md names
        run: cargo install --locked cargo-public-api@0.52.0 cargo-semver-checks@0.51.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: The version clears the floor since the last release
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/bump.ts --verify-tag "$TAG"

  github-release:
    needs: compatibility-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Extract this version's CHANGELOG section
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRE="## [${VERSION}]"

          # Body: everything under the "## [x.y.z]" heading up to the next section.
          # Literal-string matching (index==1), so brackets/dots need no escaping.
          awk -v pre="$PRE" '
            index($0, pre) == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG section found for ${PRE} — refusing to publish an empty release."
            exit 1
          fi

          # Title = the heading line without the leading "## " (quote the pattern so
          # the "##" is not parsed as bash's longest-prefix operator).
          HEADING="$(awk -v pre="$PRE" 'index($0, pre) == 1 { print; exit }' CHANGELOG.md)"
          echo "title=${HEADING#'## '}" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file notes.md \
            --verify-tag
