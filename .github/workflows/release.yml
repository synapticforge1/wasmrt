name: release

# On a version tag: first the COMPATIBILITY GATE (the tag's version must be the
# manifest's and must clear the SemVer floor since the last release, letter H6),
# then a GitHub Release from the CHANGELOG, made by `scripts/github-release.ts` through the REST
# API (no `gh`, letter H30). Publishing to crates.io stays manual (the owner runs
# `cargo publish`, AFTER this gate is green); see cmem/releasing.md.
# No secrets: the built-in GITHUB_TOKEN is enough; only the last job may write.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compatibility-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit, with history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the nightly toolchain (rustdoc JSON for the surface diff)
        run: rustup toolchain install nightly --profile minimal

      - name: Install the surface and semver tools, at the versions releasing.md names
        run: cargo install --locked cargo-public-api@0.52.0 cargo-semver-checks@0.51.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: The version clears the floor since the last release
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/bump.ts --verify-tag "$TAG"

      - name: The release-page script passes its self-test (mock API, before any write token)
        run: bun scripts/check-github-release.ts

      - name: The release page would be made from this tag (read-only dry run, real API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/github-release.ts --dry-run

  # The page through GitHub's REST API, never `gh` (workspace letters H30, H32): the tag must
  # exist and peel to this run's commit; an existing page means done; POST, then read it back.
  # Title and body come from the CHANGELOG, as before. The checkout keeps no credential.
  github-release:
    needs: compatibility-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit (no credential left in .git/config)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/github-release.ts
